<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>留存指标血缘体系</title>
<style>
  :root {
    --bg: #141414;
    --panel: #1c1c1c;
    --text: #f0f0f0;
    --muted: #a8a8a8;
    --dim: #7a7a7a;
    --line: #3a3a3a;
    --accent: #81a1c1;
    --result: #88c0d0;
    --shared: #eceff4;
    --dedicated: #8a8a8a;
    --cross: #c0c0c0;
    --fill: #2a2a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
  .lead { color: var(--muted); margin: 0 0 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-weight: 650; }
  .stat span { color: var(--muted); font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .pill { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .pill.on { background: var(--accent); color: #141414; border-color: var(--accent); }
  button.btn { border: 1px solid var(--line); background: var(--fill); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.btn.primary { background: var(--accent); color: #141414; border-color: var(--accent); }
  input[type=search] { flex: 1; min-width: 220px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; }
  svg { width: 100%; height: 640px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: block; touch-action: none; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .id { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 12px; }
  .parents { margin: 8px 0 0; padding: 0; list-style: none; }
  .parents li { font-size: 13px; color: var(--muted); margin: 4px 0; }
  .sec { color: var(--dim); font-size: 11px; margin: 10px 0 4px; letter-spacing: 0.04em; }
  .foot { color: var(--dim); font-size: 12px; margin-top: 16px; }
  @media (max-width: 720px) {
    .stats { grid-template-columns: 1fr 1fr; }
    svg { height: 480px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>留存指标血缘体系</h1>
  <p class="lead">分类只看血缘位置：谁被谁引用。结果指标由公式算出；底数是公式输入。拖动旋转，滚轮缩放，点击节点会标出所有相连指标的中文名。</p>
  <div class="legend">
    <span><i style="background:#88c0d0"></i>结果指标 · 公式产出，不再被引用</span>
    <span><i style="background:#eceff4"></i>共用底数 · 被 ≥2 个结果引用</span>
    <span><i style="background:#8a8a8a"></i>专用底数 · 只被 1 个结果引用</span>
    <span><i style="background:#c0c0c0"></i>跨域底数 · 来自用户底表 / 帖文表</span>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar" id="scopes"></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索指标中文名 / metric_name" />
    <button class="btn" id="reset">复位旋转</button>
    <button class="btn primary" id="spin">暂停旋转</button>
  </div>
  <svg id="net" viewBox="0 0 960 640" role="img" aria-label="留存指标三维血缘网"></svg>
  <p class="hint" id="status"></p>
  <div class="card" id="detail"></div>
  <p class="foot">Source: Doris prod metric_data + htmall.day_metric_def · 按公式依赖边定位，不使用原子/派生/复合 · 2026-09-08 · 单文件离线可开</p>
</div>

  {id:"all", label:"全部指标"},
  {id:"ht_day", label:"HT 日留存"},
  {id:"ht_examine", label:"HT 尽调月留存"},
  {id:"other", label:"其他产品"},
];
const ANCHOR = {
  ht:{x:-150,y:10,z:-20,r:168},
  examine:{x:170,y:20,z:10,r:132},
  user_base:{x:-40,y:-150,z:90,r:62},
  moment:{x:-210,y:130,z:70,r:36},
  other:{x:30,y:165,z:110,r:88},
};
function clusterOf(n){
  if(n.domain==="ht_retention") return "ht";
  if(n.domain==="ht_examine_retention") return "examine";
  if(n.domain==="ht_user_base") return "user_base";
  if(n.domain==="ht_moment") return "moment";
  return "other";
}
function inScope(c, scope){
  if(scope==="all") return true;
  if(scope==="ht_day") return c.domain==="ht_retention";
  if(scope==="ht_examine") return c.domain==="ht_examine_retention";
  return c.src==="inferred";
}
function fibonacciSphere(count, radius){
  const out=[], n=Math.max(count,1), golden=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){
    const y = n===1 ? 0 : 1-(i/(n-1))*2;
    const rr = Math.sqrt(Math.max(0,1-y*y));
    const theta = golden*i;
    out.push({x:Math.cos(theta)*rr*radius, y:y*radius, z:Math.sin(theta)*rr*radius});
  }
  return out;
}
function hash01(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return (h%1000)/1000; }
function rotate(p, rotY, rotX){
  const cy=Math.cos(rotY), sy=Math.sin(rotY);
  const x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy;
  const cx=Math.cos(rotX), sx=Math.sin(rotX);
  return {x:x1, y:p.y*cx-z1*sx, z:p.y*sx+z1*cx};
}
function project(p,w,h,scale){
  const d=720/(720+p.z);
  return {x:w/2+p.x*scale*d, y:h/2+p.y*scale*d, depth:p.z};
}

const nodeById = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const childrenOf = {};
for(const c of DATA.compounds){
  for(const p of c.parents){
    (childrenOf[p] ||= []).push(c.id);
  }
}
const svg = document.getElementById("net");
const NS = "http://www.w3.org/2000/svg";
const W=960, H=640;
let scope="all", q="", selected="reg_d1_retention_1d", hover=null;
let rotY=0.55, rotX=0.28, scale=1, spin=true;
let drag=null;

function visibleSet(){
  const compounds = DATA.compounds.filter(c => {
    if(!inScope(c, scope)) return false;
    if(!q.trim()) return true;
    const s=q.trim().toLowerCase();
    const parentHit = c.parents.some(p => p.toLowerCase().includes(s) || (nodeById[p]?.zh||"").toLowerCase().includes(s));
    return c.id.toLowerCase().includes(s) || c.zh.toLowerCase().includes(s) || c.formula.toLowerCase().includes(s) || parentHit;
  });
  const ids = new Set();
  for(const c of compounds){ ids.add(c.id); c.parents.forEach(p => ids.add(p)); }
  return { compounds, nodes: DATA.nodes.filter(n => ids.has(n.id)) };
}

function layout(nodes){
  const groups={};
  for(const n of nodes){ (groups[clusterOf(n)] ||= []).push(n); }
  const pos={};
  for(const [k,list] of Object.entries(groups)){
    const a=ANCHOR[k]||ANCHOR.other;
    const pts=fibonacciSphere(list.length, a.r);
    list.forEach((n,i)=>{
      const jitter=(hash01(n.id)-0.5)*8;
      const layer=ROLE_LAYER[n.role]||0.9;
      pos[n.id]={x:a.x+pts[i].x*layer+jitter, y:a.y+pts[i].y*layer, z:a.z+pts[i].z*layer};
    });
  }
  return pos;
}

function el(name, attrs, text){
  const n=document.createElementNS(NS, name);
  for(const [k,v] of Object.entries(attrs||{})) n.setAttribute(k, v);
  if(text!=null) n.textContent=text;
  return n;
}

function render(){
  const vis=visibleSet();
  const pos=layout(vis.nodes);
  const edges=[];
  for(const c of vis.compounds) for(const p of c.parents) if(pos[p]&&pos[c.id]) edges.push({from:p,to:c.id});
  const degree={};
  for(const e of edges){ degree[e.from]=(degree[e.from]||0)+1; degree[e.to]=(degree[e.to]||0)+1; }
  const foci=[selected, hover].filter(Boolean);
  const nb=new Set(foci);
  for(const e of edges) if(foci.includes(e.from)||foci.includes(e.to)){ nb.add(e.from); nb.add(e.to); }
  if(!vis.nodes.some(n=>n.id===selected) && vis.compounds[0]) selected=vis.compounds[0].id;

  const projected={};
  for(const n of vis.nodes){
    const r=rotate(pos[n.id], rotY, rotX);
    projected[n.id]={...project(r,W,H,scale), id:n.id};
  }
  const ordered=[...vis.nodes].sort((a,b)=>projected[a.id].depth-projected[b.id].depth);

  while(svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(el("text",{x:16,y:28,fill:"#a8a8a8","font-size":12},
    `留存指标血缘网 · ${vis.nodes.length} 个指标 · ${edges.length} 条公式依赖`));
  svg.appendChild(el("text",{x:16,y:46,fill:"#7a7a7a","font-size":11},
    "左团 HT 日留存 · 右团尽调月留存 · 下为跨域底数 · 前为其他产品"));

  const gLines=el("g");
  for(const e of edges){
    const a=projected[e.from], b=projected[e.to];
    if(!a||!b) continue;
    const hot=nb.has(e.from)&&nb.has(e.to);
    gLines.appendChild(el("line",{
      x1:a.x,y1:a.y,x2:b.x,y2:b.y,
      stroke: hot ? "#81a1c1" : "#3a3a3a",
      "stroke-width": hot ? 1.6 : 0.6,
      opacity: hot ? 0.9 : 0.28,
    }));
  }
  svg.appendChild(gLines);

  for(const n of ordered){
    const p=projected[n.id];
    const deg=degree[n.id]||1;
    const r=3.2+Math.min(7, Math.sqrt(deg)*1.6)+(n.role==="result"?1.2:n.role==="shared_base"?1.6:0);
    const isSel=n.id===selected, isHov=n.id===hover, isNb=nb.has(n.id);
    const fill = isSel ? "#81a1c1" : (ROLE_FILL[n.role]||"#8a8a8a");
    const g=el("g",{style:"cursor:pointer"});
    g.appendChild(el("circle",{
      cx:p.x, cy:p.y, r: isSel? r+2.4:r,
      fill, stroke: (isSel||isHov)?"#81a1c1":"#3a3a3a",
      "stroke-width": isSel?2:0.8,
      opacity: (isNb || !selected) ? 1 : 0.22,
    }));
    if(isSel||isHov||isNb){
      g.appendChild(el("text",{
        x:p.x+r+5, y:p.y+4, fill:"#f0f0f0", "font-size":11,
        "font-weight": isSel?600:400
      }, n.zh||n.id));
    }
    g.addEventListener("click", ev => { ev.stopPropagation(); selected=n.id; spin=false; syncSpinBtn(); render(); });
    g.addEventListener("pointerenter", () => { hover=n.id; render(); });
    g.addEventListener("pointerleave", () => { if(hover===n.id) hover=null; render(); });
    svg.appendChild(g);
  }

  const roleCnt = {result:0, shared_base:0, dedicated_base:0, cross_base:0};
  for(const n of vis.nodes) roleCnt[n.role] = (roleCnt[n.role]||0)+1;
  document.getElementById("stats").innerHTML = [
    [roleCnt.result, "结果指标"],
    [roleCnt.shared_base, "共用底数"],
    [roleCnt.dedicated_base, "专用底数"],
    [roleCnt.cross_base, "跨域底数"],
  ].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");

  const meta = DATA.compounds.find(c=>c.id===selected);
  const node = nodeById[selected];
  const detail=document.getElementById("detail");
  if(node){
    const ups = (meta && meta.parents || []).map(pid => {
      const p=nodeById[pid];
      return `<li>${p?.zh||pid} · ${ROLE[p?.role]||""} · ${pid}</li>`;
    }).join("");
    const downs = (childrenOf[selected]||[]).map(cid => {
      const c=nodeById[cid];
      const fam = DATA.compounds.find(x=>x.id===cid);
      return `<li>${c?.zh||cid} · ${FAMILY[fam?.family]||"结果"} · ${cid}</li>`;
    }).join("");
    const fam = meta ? (FAMILY[meta.family]||meta.family) : "";
    const usage = node.role==="result"
      ? `依赖 ${node.in_deg} 个底数`
      : `被 ${node.out_deg} 个结果引用`;
    detail.innerHTML = `<h2>${node.zh||node.id}</h2>
      <div class="id">${node.id} · ${ROLE[node.role]||""}${fam?" · "+fam:""} · ${usage} · ${node.storage||""}</div>
      ${meta && meta.formula ? `<pre>${meta.formula}</pre>` : ""}
      ${ups ? `<div class="sec">上游底数</div><ul class="parents">${ups}</ul>` : ""}
      ${downs ? `<div class="sec">下游结果</div><ul class="parents">${downs}</ul>` : ""}
      ${!ups && !downs ? `<p class="id">当前范围内没有相连指标。</p>` : ""}`;
  }
  const hn = hover ? nodeById[hover] : node;
  document.getElementById("status").textContent = hn
    ? `${hover?"悬停":"选中"}：${hn.zh}（${hn.id} · ${ROLE[hn.role]||""} · ${hn.storage||""}）  拖动旋转 · 滚轮缩放`
    : "拖动旋转 · 滚轮缩放 · 点击节点";
}

function syncSpinBtn(){
  const b=document.getElementById("spin");
  b.textContent = spin ? "暂停旋转" : "自动旋转";
  b.className = "btn" + (spin ? " primary" : "");
}

const scopes=document.getElementById("scopes");
for(const s of SCOPES){
  const b=document.createElement("button");
  b.className="pill"+(s.id===scope?" on":"");
  b.textContent=s.label;
  b.onclick=()=>{
    scope=s.id;
    const first=DATA.compounds.find(c=>inScope(c,s.id));
    if(first) selected=first.id;
    [...scopes.children].forEach((el,i)=> el.classList.toggle("on", SCOPES[i].id===scope));
    render();
  };
  scopes.appendChild(b);
}
document.getElementById("q").addEventListener("input", e => { q=e.target.value; render(); });
document.getElementById("reset").onclick=()=>{ rotX=0.28; rotY=0.55; scale=1; spin=true; syncSpinBtn(); render(); };
document.getElementById("spin").onclick=()=>{ spin=!spin; syncSpinBtn(); };

svg.addEventListener("pointerdown", e => { drag={x:e.clientX,y:e.clientY}; spin=false; syncSpinBtn(); svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => {
  if(!drag) return;
  rotY += (e.clientX-drag.x)*0.008;
  rotX = Math.max(-1.1, Math.min(1.1, rotX+(e.clientY-drag.y)*0.008));
  drag={x:e.clientX,y:e.clientY};
  render();
});
svg.addEventListener("pointerup", () => { drag=null; });
svg.addEventListener("pointerleave", () => { drag=null; });
svg.addEventListener("wheel", e => {
  e.preventDefault();
  scale = Math.max(0.55, Math.min(2.4, scale*(e.deltaY>0?0.92:1.08)));
  render();
}, {passive:false});

function tick(){
  if(spin && !drag){ rotY += 0.0032; render(); }
  requestAnimationFrame(tick);
}
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
